# DEVELOPMENT (default; every setting has a safe default, no .env needed)
#   docker compose up --build         # Postgres + migrations + API :8000 + shop :5173 + helpdesk :5174
#   docker compose down               # stop (data kept in the pgdata volume)
#   docker compose down -v            # stop and wipe the database volume too
#   docker compose exec web python manage.py createsuperuser
#
# PRODUCTION (adds Redis, Celery worker/beat and Nginx with TLS; skips the frontends)
#   cp .env.example deploy/.env       # then set the values listed under "production" below
#   docker compose --env-file deploy/.env --profile prod up -d --build nginx worker beat
#   (nginx pulls in web, migrate, db and redis; certificates go in deploy/certs/)
#
# Production values to put in deploy/.env (override the dev defaults used below):
#   COMPOSE_PROJECT_NAME=tss  POSTGRES_PASSWORD  DJANGO_SECRET_KEY  DJANGO_ALLOWED_HOSTS
#   DJANGO_DEBUG=False  DJANGO_BEHIND_PROXY=True  DB_SSLMODE=disable
#   REDIS_URL=redis://redis:6379/1  CELERY_BROKER_URL=redis://redis:6379/0
#   CORS_ALLOWED_ORIGINS  CSRF_TRUSTED_ORIGINS  FRONTEND_URL
#
# COMPOSE_PROJECT_NAME keeps dev (tss-dev_pgdata) and prod (tss_pgdata) volumes separate.
name: ${COMPOSE_PROJECT_NAME:-tss-dev}

x-backend: &backend
  build:
    context: .
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-tss}:${POSTGRES_PASSWORD:-tss_password}@db:5432/${POSTGRES_DB:-tss}
    DB_SSLMODE: ${DB_SSLMODE:-disable}   # the Postgres container has no SSL (settings default is "require")
    DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
    DJANGO_BEHIND_PROXY: ${DJANGO_BEHIND_PROXY:-False}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    REDIS_URL: ${REDIS_URL:-}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    FRONTEND_URL: ${FRONTEND_URL:-}
    # Browsers call the API from the frontends' origins (host ports below)
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${SHOP_PORT:-5173},http://127.0.0.1:${SHOP_PORT:-5173},http://localhost:${HELPDESK_PORT:-5174},http://127.0.0.1:${HELPDESK_PORT:-5174}}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:${SHOP_PORT:-5173},http://localhost:${HELPDESK_PORT:-5174}}
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tss_password}
      POSTGRES_DB: ${POSTGRES_DB:-tss}       # created automatically on first start
    # No host port is published, so it can't clash with a Postgres already on your machine.
    # The containers reach it at db:5432. To use psql/a GUI from your Mac, add:
    #   ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Production only: cache and Celery broker.
  redis:
    profiles: ["prod"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: waits for a healthy DB, applies all migrations, then exits.
  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live/')"]
      interval: 15s
      retries: 5
    restart: unless-stopped

  # Production only: background jobs.
  worker:
    <<: *backend
    profiles: ["prod"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Production only: scheduled jobs.
  beat:
    <<: *backend
    profiles: ["prod"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Production only: TLS termination; serves uploaded media directly from the shared volume.
  nginx:
    profiles: ["prod"]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Storefront / admin UI (React + Vite, built then served by nginx) -> http://localhost:5173
  shop:
    build:
      context: ../Tss-shop
      args:
        # Inlined at build time and used by YOUR BROWSER, so it must be the host-published API address
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${SHOP_PORT:-5173}:80"
    depends_on:
      - web
    restart: unless-stopped

  # Help desk UI -> http://localhost:5174
  helpdesk:
    build:
      context: ../Tss-helpdesk
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${HELPDESK_PORT:-5174}:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
