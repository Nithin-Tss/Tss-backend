name: Backend CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-only values. Real secrets live in Render, never in this file.
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  DJANGO_DEBUG: "True"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches local development, 3.14 is what Render runs.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --settings=config.test_settings

      - name: Run tests
        # In-memory SQLite, see config/test_settings.py
        run: python manage.py test --settings=config.test_settings --parallel

  migrations:
    name: Migrations (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tss_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_NAME: tss_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Catches conflicting leaf migrations (the 0010 clash) and models changed without a migration.
      - name: Check for missing or conflicting migrations
        run: python manage.py makemigrations --check --dry-run

      # The tests skip migrations, so apply them to a real database here.
      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput
