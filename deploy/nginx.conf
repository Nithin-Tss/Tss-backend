# Reverse proxy for the Django API. TLS certificates: deploy/certs/fullchain.pem and privkey.pem.
upstream api {
  server web:8000;
}

# Stay under the Django upload limits; Django enforces the exact per-file rules.
client_max_body_size 25m;

server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # Uploaded images and files come straight from disk. Never let a browser run an upload as a page.
  location /media/ {
    alias /srv/media/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Cache-Control "public, max-age=86400";
  }

  # The theme editor's live-sync stream (Server-Sent Events) must not be buffered.
  location ~ ^/api/v1/.*/events/?$ {
    proxy_pass http://api;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://api;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
