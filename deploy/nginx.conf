# Hardened reverse proxy for the Django API / storefronts.
# TLS certificates: deploy/certs/fullchain.pem and privkey.pem (never commit the key; it is git-ignored).
#
# This file is loaded as conf.d/default.conf, i.e. inside the `http {}` block, so only http-level
# directives are used. Django still owns CSP / X-Frame-Options / Referrer-Policy for the API and the
# storefront pages (theme previews are framed on purpose), so nginx does not override those.

# ---------------------------------------------------------------------------------------------
# Global hardening
# ---------------------------------------------------------------------------------------------
server_tokens off;                       # do not leak the nginx version

# Slowloris / oversized request protection
client_header_timeout   10s;
client_body_timeout     30s;
send_timeout            30s;
keepalive_timeout       15s;
reset_timedout_connection on;
client_header_buffer_size   2k;
large_client_header_buffers 4 8k;
client_body_buffer_size     128k;
# Stay under the Django upload limits (DATA_UPLOAD in settings); Django enforces the exact per-file rules.
client_max_body_size 25m;

# Only the verbs the API uses
map $request_method $bad_method {
  default 1;
  GET     0;
  HEAD    0;
  POST    0;
  PUT     0;
  PATCH   0;
  DELETE  0;
  OPTIONS 0;
}

# Rate limits (per client IP). Django's throttles remain the precise, per-user layer behind these.
limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;    # login / register / refresh / password reset
limit_req_zone  $binary_remote_addr zone=admin:10m rate=30r/m;    # Django admin
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

upstream api {
  server web:8000;
  keepalive 32;
}

# NOTE: add_header in a location replaces the server-level ones, so locations that add their own repeat HSTS/nosniff.
# ---------------------------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------------------------
server {
  listen 80 default_server;
  server_name _;

  # Health checks from the platform must work over plain http
  location = /api/v1/health/live/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    access_log off;
  }

  # ACME http-01 challenges (certbot webroot) could be allowed here if you automate renewals:
  # location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------------------------
server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  # --- TLS -------------------------------------------------------------------------------
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;         # modern clients choose; all listed suites are AEAD + forward secret
  ssl_ecdh_curve      X25519:secp384r1:prime256v1;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;               # tickets weaken forward secrecy unless keys are rotated
  # OCSP stapling needs a CA-issued chain (it only logs a warning for self-signed dev certs).
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver            1.1.1.1 9.9.9.9 valid=300s ipv6=off;
  resolver_timeout    5s;

  # --- Headers (nginx-owned; Django adds CSP / frame / referrer policy to its own responses) ---
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;
  # No `preload`: only add it once every subdomain is permanently HTTPS (store subdomains share this host).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;

  # --- Request filtering -----------------------------------------------------------------
  if ($bad_method) { return 405; }

  # Hidden files (.env, .git, .htaccess ...) and backup/source leftovers never leave this server
  location ~ /\.(?!well-known/) { return 404; }
  location ~* \.(?:env|git|bak|backup|old|orig|sql|sqlite3?|log|ini|conf|py|pyc|swp|yml|yaml|toml)$ { return 404; }

  # --- Shared proxy settings (re-declared per location; proxy_* is inherited only when a
  #     location sets none of its own) -----------------------------------------------------
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  # Overwrite, never append: a client-supplied X-Forwarded-For must not be trusted. Django runs with
  # DJANGO_NUM_PROXIES=1, so it reads exactly this one hop.
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  proxy_buffering       on;
  proxy_redirect        off;

  # --- Uploaded files: straight from disk, never executable as a page ---------------------
  location /media/ {
    alias /srv/media/;
    limit_except GET HEAD { deny all; }
    autoindex off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;   # storefronts on other hosts embed these images
    add_header Cache-Control "public, max-age=86400";
    # Uploaded HTML/SVG/JS must download, not render, if somebody navigates to it directly
    location ~* \.(?:html?|xhtml|xml|js|mjs|svg|svgz)$ {
      add_header Content-Disposition "attachment" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      add_header Cache-Control "public, max-age=86400";
    }
  }

  # --- Health ----------------------------------------------------------------------------
  location = /api/v1/health/live/ {
    proxy_pass http://api;
    access_log off;
  }
  # Readiness reports DB/Redis state: internal use only (the compose health check talks to gunicorn directly)
  location = /api/v1/health/ready/ { return 404; }

  # --- Auth endpoints: strict per-IP limit (credential stuffing / brute force) -------------
  location ^~ /api/v1/auth/ {
    limit_req  zone=auth burst=10 nodelay;
    limit_conn perip 20;
    proxy_pass http://api;
  }

  # --- Django admin: tight limit; also restrict by IP when you can --------------------------
  location ^~ /admin/ {
    limit_req  zone=admin burst=15 nodelay;
    limit_conn perip 20;
    # allow 203.0.113.0/24;   # your office / VPN range
    # deny  all;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass http://api;
  }

  # --- Theme editor live-sync stream (Server-Sent Events): unbuffered, few per IP -----------
  location ~ ^/api/v1/.*/events/?$ {
    limit_req  zone=api burst=20 nodelay;
    limit_conn perip 10;
    proxy_pass http://api;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;
    add_header X-Accel-Buffering "no" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # --- Everything else: API, storefronts (/s/<slug>/ and store domains), static via WhiteNoise ---
  location / {
    limit_req  zone=api burst=60 nodelay;
    limit_conn perip 50;
    proxy_pass http://api;
  }
}
